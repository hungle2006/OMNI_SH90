name: AppDock Arduino Compiler
run-name: "AppDock Arduino · ${{ inputs.request_id || 'smoke' }}"
on:
  workflow_dispatch:
    inputs:
      request_id:
        description: 'UUID to correlate build'
        required: true
        type: string
      board:
        description: 'Arduino board ID'
        required: true
        type: choice
        options:
          - uno
          - nano
          - nano_old
          - rf_nano
          - rf_nano_old
          - mega
          - leonardo
          - esp32
          - esp8266
      sketch_b64:
        description: 'Base64 UTF-8 sketch (max 36KB)'
        required: true
        type: string
  push:
    branches: [main]
    paths: ['.github/workflows/appdock-arduino.yml']
permissions:
  contents: read
concurrency:
  group: appdock-arduino-${{ github.event_name }}-${{ github.event.inputs.request_id || github.ref }}
  cancel-in-progress: false
jobs:
  compile:
    runs-on: ubuntu-22.04
    timeout-minutes: 18
    env:
      BOARD: ${{ inputs.board || 'uno' }}
      SKETCH_B64: ${{ inputs.sketch_b64 || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Arduino CLI
        uses: arduino/setup-arduino-cli@v2
      - name: Validate sketch and select FQBN
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, os, pathlib, re, sys
          boards = {
            'uno':'arduino:avr:uno',
            'nano':'arduino:avr:nano:cpu=atmega328',
            'nano_old':'arduino:avr:nano:cpu=atmega328old',
            'rf_nano':'arduino:avr:nano:cpu=atmega328',
            'rf_nano_old':'arduino:avr:nano:cpu=atmega328old',
            'mega':'arduino:avr:mega:cpu=atmega2560',
            'leonardo':'arduino:avr:leonardo',
            'esp32':'esp32:esp32:esp32',
            'esp8266':'esp8266:esp8266:nodemcuv2',
          }
          board=os.getenv('BOARD','uno')
          if board not in boards: sys.exit('Invalid board')
          encoded=os.getenv('SKETCH_B64','')
          if encoded:
              if len(encoded)>49000 or not re.fullmatch(r'[A-Za-z0-9+/=]+',encoded): sys.exit('Invalid sketch payload')
              try: code=base64.b64decode(encoded,validate=True).decode('utf-8')
              except Exception: sys.exit('Malformed base64 UTF-8')
          else:
              code='void setup(){pinMode(LED_BUILTIN,OUTPUT);}\nvoid loop(){digitalWrite(LED_BUILTIN,HIGH);delay(500);digitalWrite(LED_BUILTIN,LOW);delay(500);}\n'
          if not code.strip() or len(code.encode('utf-8'))>36000: sys.exit('Invalid sketch length')
          path=pathlib.Path('build/AppDockSketch')
          path.mkdir(parents=True,exist_ok=True)
          (path/'AppDockSketch.ino').write_text(code,encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a') as output: output.write('FQBN='+boards[board]+'\n')
          print('Board:',board)
          PY
      - name: Cache Arduino platform
        uses: actions/cache@v4
        with:
          path: ~/.arduino15
          key: appdock-cores-${{ runner.os }}-${{ env.BOARD }}-v2
      - name: Install selected board platform
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$BOARD" == "esp32" ]]; then
            URL='https://espressif.github.io/arduino-esp32/package_esp32_index.json'
            arduino-cli core update-index --additional-urls "$URL"
            arduino-cli core install esp32:esp32 --additional-urls "$URL"
          elif [[ "$BOARD" == "esp8266" ]]; then
            URL='https://arduino.esp8266.com/stable/package_esp8266com_index.json'
            arduino-cli core update-index --additional-urls "$URL"
            arduino-cli core install esp8266:esp8266 --additional-urls "$URL"
          else
            arduino-cli core update-index
            arduino-cli core install arduino:avr
          fi
      - name: Compile firmware
        shell: bash
        run: |
          mkdir -p build/output
          arduino-cli compile --fqbn "$FQBN" --output-dir build/output --warnings default build/AppDockSketch
      - name: Package firmware
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os,shutil,sys
          board=os.environ['BOARD']
          folder=Path('build/firmware')
          folder.mkdir(parents=True,exist_ok=True)
          included=[]
          for src in Path('build/output').iterdir():
              if src.is_file() and src.suffix.lower() in ('.bin','.hex','.json') and 'with_bootloader' not in src.name:
                  shutil.copy2(src, folder/src.name)
                  included.append(src.name)
          suffix='.hex' if board in ('uno','nano','nano_old','rf_nano','rf_nano_old','mega','leonardo') else '.bin'
          if not any(name.endswith(suffix) for name in included): sys.exit('Firmware missing')
          (folder/'appdock-build.json').write_text(json.dumps({'board':board,'fqbn':os.environ['FQBN'],'files':included},indent=2))
          print('Firmware:', included)
          PY
      - name: Publish firmware artifact (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: appdock-firmware-${{ inputs.request_id || 'smoke' }}
          path: build/firmware/
          retention-days: 7
          if-no-files-found: error
